services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoya_db
      POSTGRES_PASSWORD: zoya_demo
      POSTGRES_USER: zoya
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'zoya', '-d', 'zoya_db']
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
